<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Firewall Security Faceoff</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="game/game.css">
</head>
<body>
  <div id="game" class="phase-title">
    <header id="hud" aria-label="Game status">
      <span class="hud-logo">FIREWALL FACEOFF</span>
      <span id="hud-hp" class="hud-meter" role="img"></span>
      <span id="hud-cust" class="hud-meter" role="img"></span>
      <span class="hud-score"><span class="hud-small">SCORE</span><strong id="hud-score">0</strong></span>
      <span id="hud-combo" class="hud-combo"></span>
      <span class="hud-wave"><span id="wave-label" class="hud-small">WAVE</span><span class="wave-track"><span id="wave-fill"></span></span></span>
      <span class="hud-spacer"></span>
      <button type="button" id="btn-pause" class="hud-btn" aria-pressed="false">PAUSE</button>
      <button type="button" id="btn-restart" class="hud-btn">RETRY</button>
      <button type="button" id="btn-levels" class="hud-btn">LEVELS</button>
      <button type="button" id="btn-log" class="hud-btn" aria-expanded="false">LOG</button>
      <button type="button" id="btn-sound" class="hud-btn" aria-pressed="true">SOUND ON</button>
    </header>

    <main id="stage">
      <canvas id="field" aria-hidden="true"></canvas>
      <p id="mission" class="mission-strip"></p>
      <div id="wall-zone">
        <ol id="wall" aria-label="Your wall. The top gate is checked first."></ol>
      </div>
      <p id="coach" role="status" aria-live="polite"></p>
      <div id="banner" aria-hidden="true"></div>
    </main>

    <footer id="tray-zone">
      <ul id="tray" aria-label="Spare gates"></ul>
      <p class="tray-help"><span class="key key-good">&#9632; WANTED</span> <span class="key key-bad">&#9650; ATTACK</span> <span class="key key-stray">&#9679; NOT NEEDED</span> <span class="tray-how">DRAG OR CLICK A GATE TO ADD IT &middot; DRAG IT OFF TO REMOVE &middot; P PAUSES</span></p>
    </footer>

    <aside id="log-panel" hidden aria-label="Text log of every packet">
      <h2>PACKET LOG</h2>
      <ol id="log"></ol>
    </aside>

    <div id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
      <div class="modal-card">
        <h1 id="modal-title"></h1>
        <div id="modal-body"></div>
        <div id="modal-actions" class="modal-actions"></div>
      </div>
    </div>

    <div id="live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  </div>
  <noscript>This game needs JavaScript. A text edition is at classic.html.</noscript>
  <script type="module" src="game/arcade.js"></script>
</body>
</html>
